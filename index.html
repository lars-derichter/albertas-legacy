<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>The Legacy of Alberta</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="beeld"><canvas id="scherm" width="320" height="200"></canvas></div>

<!-- De gesimuleerde pc als DOM-overlay bovenop het canvas (zie
     engine-architectuur.md, §"De gesimuleerde pc"). Verborgen tot de speler
     aan de pc gaat zitten; js/pc/ vult de editor, de terminal en Parsons in. -->
<div id="pc-overlay" aria-hidden="true"></div>

<!-- Laadvolgorde exact volgens engine-architectuur.md, §"Laadvolgorde in
     index.html". Losse <script>-tags, geen ES-modules: alles hangt aan het
     globale AL-object zodat het spel ook vanaf file:// werkt (dubbelklik). -->

<!-- 1–6: renderer, invoer, geluid, parser -->
<script src="js/palette.js"></script>
<script src="js/font.js"></script>
<script src="js/gfx.js"></script>
<script src="js/input.js"></script>
<script src="js/sound.js"></script>
<script src="js/parser.js"></script>

<!-- 7–12: DOM-vrije logica -->
<script src="js/logic/strings.js"></script>
<script src="js/logic/world.js"></script>
<!-- 9–11: de Java-checker -->
<script src="js/logic/checker/tokenizer.js"></script>
<script src="js/logic/checker/asserts.js"></script>
<script src="js/logic/checker/javacsim.js"></script>
<script src="js/logic/levels.js"></script>

<!-- 13: js/levels/level1.js … level7.js. level0.js is TESTINHOUD
     ("de proefdruk") en wordt NIET in productie geladen: alleen bij ?dev=1
     schrijft de loader hieronder de <script>-tag in (document.write draait
     synchroon vóór de volgende tags, ook op file://). Zo blijft level 0
     onbereikbaar in een gewone playthrough. -->
<script>
  (function () {
    try {
      if (/[?&]dev=1\b/.test(window.location.search)) {
        document.write('<scr' + 'ipt src="js/levels/level0.js"></scr' + 'ipt>');
      }
    } catch (e) { /* niets */ }
  })();
</script>

<!-- De echte productielevels (scharnieren 1–7). Altijd geladen, niet dev-gated. -->
<script src="js/levels/level1.js"></script>
<script src="js/levels/level2.js"></script>
<script src="js/levels/level3.js"></script>
<script src="js/levels/level4.js"></script>
<script src="js/levels/level5.js"></script>
<script src="js/levels/level6.js"></script>
<script src="js/levels/level7.js"></script>

<!-- 14: js/pc/*.js — de gesimuleerde pc (DOM-overlay). editor/terminal/parsons
     eerst, dan de coördinator pc.js. -->
<script src="js/pc/editor.js"></script>
<script src="js/pc/terminal.js"></script>
<script src="js/pc/parsons.js"></script>
<script src="js/pc/pc.js"></script>

<!-- 15–16: scènes + sprites -->
<script src="js/scenes/scene-titelkaart.js"></script>
<script src="js/scenes/scene-opening-huis.js"></script>
<script src="js/scenes/scene-opening-trap.js"></script>
<script src="js/scenes/scene-opening-pc.js"></script>
<script src="js/scenes/scene-zolder-west.js"></script>
<script src="js/scenes/scene-zolder-midden.js"></script>
<script src="js/scenes/scene-zolder-oost.js"></script>
<script src="js/scenes/scene-overloop.js"></script>
<script src="js/scenes/spread-schetsen.js"></script>
<script src="js/scenes/scene-spread-template.js"></script>
<script src="js/scenes/scene-eindkaart.js"></script>
<script src="js/sprites/sprite-speler.js"></script>
<script src="js/sprites/sprite-notitieboek.js"></script>
<script src="js/sprites/sprite-pc.js"></script>
<script src="js/sprites/sprite-doos.js"></script>
<script src="js/sprites/sprite-broncode-doos.js"></script>
<script src="js/sprites/sprite-stoel.js"></script>

<!-- 17: js/sim/*.js — de Seven Little Goats-simulatie (DOM-vrij: strings, world,
     combat). Daarna de dunne DOM-controller die de sim in het terminalpaneel van
     de pc-overlay draait (raakt de DOM, dus bij de pc-renderlaag; laadt ná pc.js
     en ná de sim-logica). -->
<script src="js/sim/goats-strings.js"></script>
<script src="js/sim/goats-world.js"></script>
<script src="js/sim/goats-combat.js"></script>
<script src="js/pc/sim-terminal.js"></script>

<!-- 18: de engine -->
<script src="js/engine.js"></script>

<!-- 19: het aanraakscherm-D-pad en de mobiele commandobalk (enkel actief op
     een toestel zonder fysiek toetsenbord; zie js/touch.js). Allerlaatste,
     want het leunt op AL.input, AL.engine.advance en AL.debugState. -->
<script src="js/touch.js"></script>
</body>
</html>
